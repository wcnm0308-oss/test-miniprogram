name: 小程序最小闭环测试

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: 安装 Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: 安装 miniprogram-ci
        run: npm install -g miniprogram-ci

      - name: 模拟构建检查
        run: |
          echo "开始检查小程序文件结构"
          ls -R
          echo "检查完成"
